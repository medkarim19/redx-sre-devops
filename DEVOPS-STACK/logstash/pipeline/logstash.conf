input {
        file {
                path => "/usr/share/logstash/data/*.json"
                start_position => "beginning"
                codec => multiline {
                        pattern => "^Spalanzi"
                        negate => true
                        what => "previous"
                        auto_flush_interval => 1
                        multiline_tag => ""
                }
                mode => "read"
                sincedb_path => "/usr/share/logstash/data/.sincedb"
         }
}

filter{
        json{
        source => "message"
        } 
   ruby {
      code => '
      if event.get("runs").is_a?(Array)
        runs = event.get("runs")
        runs.each do |run|
          if run["testcases"].is_a?(Array)
            run["testcases"].each do |tc|
                if tc["perfvars"].is_a?(Array)
                   tc["perfvars"].each do |pv|
                      event.set(pv["name"], pv["value"]) if pv["name"] && pv["value"]
                   end
                end
                if tc["nodelist"].is_a?(Array)
                        event.set("nodelist",tc["nodelist"])
                end
                if tc["name"]
                        event.set("name", tc["name"])
                end
            end
          end
        end
      end
    '
  }
  ruby {
    code => '
      session_info = event.get("session_info")
      if session_info.is_a?(Hash)
        event.set("session_start", session_info["time_start"]) if session_info.key?("time_start")
        event.set("session_duration", session_info["time_elapsed"]) if session_info.key?("time_elapsed")
      end
    '
  }
  mutate {
                lowercase => [ "name" ]
                remove_field => [ "session_info", "message", "runs" , "event" , "restored_cases" , "host" ]
  }
}
output {
        elasticsearch {
                hosts => ["http://elasticsearch:9200"]
                index => "%{[name]}-%{+YYYY.MM.dd}"
                user => "elastic"
                password => "elastic"
        }
        stdout { codec => rubydebug }
}
